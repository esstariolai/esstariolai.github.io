<style>

#cmb{color:#ff4fd8}
#foot{position:fixed;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:300;font-size:clamp(13px,1.6vw,18px);letter-spacing:.32em;text-transform:uppercase;pointer-events:none;opacity:0;animation:fin 2.5s 2.8s forwards;text-shadow:0 0 18px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.6)}

#lb{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:100px;width:34px;height:34px;padding:0;background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:50%;font-size:15px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}

#tip{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:12px;width:min(300px,calc(100vw - 24px));box-sizing:border-box;padding:14px 16px 14px;background:rgba(5,38,55,.94);border:1px solid var(--sun);border-radius:14px;font-size:13px;line-height:1.5;box-shadow:0 10px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s;pointer-events:none;z-index:6}

.card{position:relative;width:min(380px,100%);box-sizing:border-box;background:#0a4560;border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

#lbl li:nth-child(1)::before{content:"\1F947";opacity:1}#lbl li:nth-child(2)::before{content:"\1F948";opacity:1}#lbl li:nth-child(3)::before{content:"\1F949";opacity:1}

#ms{position:fixed;left:0;right:0;top:calc(13vh + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;opacity:0;transform:scale(.85);transition:opacity .45s,transform .45s;z-index:4}
#ms.on{opacity:1;transform:none}
#ms small{display:block;font-size:11px;letter-spacing:.4em;text-transform:uppercase;opacity:.8;margin-bottom:6px}

#stamp{position:fixed;left:50%;top:50%;padding:14px 26px;border:5px solid #ff2fb4;border-radius:12px;color:#ff2fb4;font-weight:800;font-size:clamp(22px,4.5vw,46px);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);z-index:5;mix-blend-mode:screen;text-align:center;line-height:1.1}

#stamp.on{animation:stamp 3.6s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}12%{opacity:.95;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}80%{opacity:.95;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.me-row{font-size:12px;margin:-6px 0 12px;opacity:.9}.me-row b{color:var(--sun)}
.lnk{background:none;border:0;color:#fff;opacity:.7;font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:4px}

.lnk.del{color:#ff8fb8}.danger{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}.danger .lnk{padding:4px 0}
#who{font:inherit;font-size:11px;font-weight:600;background:rgba(255,255,255,.1);border:0;border-radius:99px;color:#fff;padding:4px 10px;cursor:pointer;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#who::before{content:"\1F464  "}
.prize{text-align:center;border-color:var(--sun);max-height:92vh;overflow:auto}
.prize .medal{font-size:46px;line-height:1;margin-bottom:6px}
.prize p{margin:6px 0 10px}
.rb{font-size:48px;background:linear-gradient(90deg,#00c2ff,#ff2fb4,#ffe100,#00c2ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rgb 4s linear infinite}
#pzem,#pzfb{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);color:#fff;outline:none;user-select:text;-webkit-user-select:text;margin-bottom:10px;resize:vertical}
#pzem:focus,#pzfb:focus{border-color:var(--sun)}
.ck{display:flex;gap:8px;text-align:left;font-size:12px;line-height:1.4;margin:0 0 10px;opacity:.9;cursor:pointer}.ck input{margin-top:2px;accent-color:#ffd400}.ck i{opacity:.6}
.err{color:#ff8fb8;font-size:12px;min-height:16px;margin-bottom:6px}

.inp{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);color:#fff;outline:none;user-select:text;-webkit-user-select:text;margin-bottom:10px;resize:vertical}
.inp:focus{border-color:var(--sun)}
.lab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.prow{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.pbtn{flex:1;display:flex;justify-content:space-between;font:inherit;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.pbtn span{color:var(--sun);font-weight:800}.prow.cur .pbtn{border-color:var(--sun);background:rgba(255,212,0,.12)}
.hint{font-size:11px!important;opacity:.6!important;margin:0 0 8px!important}
#hlp,#lng{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));width:34px;height:34px;padding:0;background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:50%;font:inherit;font-size:15px;font-weight:800;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
#hlp{left:184px}#lng{left:226px;font-size:10px;letter-spacing:.04em}
#pse{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:268px;width:34px;height:34px;padding:0;background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:50%;font-size:11px;letter-spacing:-1px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
#pse:hover{border-color:var(--sun);color:var(--sun)}#pse.on{background:var(--sun);color:#0b4a63;border-color:var(--sun);font-size:13px;letter-spacing:0}
#pmsg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 22px;border-radius:18px;background:rgba(4,30,45,.78);border:1px solid rgba(255,255,255,.3);font-size:13px;letter-spacing:.06em;line-height:1.45;text-align:center;width:max-content;max-width:min(420px,calc(100vw - 48px));box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .3s;z-index:3;backdrop-filter:blur(6px)}
#pmsg.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(5vh + 92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);padding:9px 18px;border-radius:99px;background:rgba(4,30,45,.8);border:1px solid var(--sun);color:#fff;font-size:12px;letter-spacing:.05em;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:4}

#hlp:hover,#lng:hover{border-color:var(--sun);color:var(--sun)}
.help{width:min(720px,100%);max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 26px 8px 0}

.langs{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:99px;padding:3px}

.langs button.on{background:var(--sun);color:#0b4a63;opacity:1}
#helpbody{font-size:14px;line-height:1.6}

#helpbody p{margin:0 0 6px;opacity:.9;font-size:14px}
.warn{background:rgba(255,47,180,.14);border:1px solid rgba(255,47,180,.6);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin:6px 0 4px}

/* ---- achievements */
#ach{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:142px;width:34px;height:34px;padding:0;background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:50%;font-size:15px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
#ach:hover{border-color:var(--sun)}
#ach b{position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:99px;background:linear-gradient(135deg,#ff2fb4,#ffd400);color:#0b2a3c;font-size:9.5px;font-weight:800;line-height:17px;display:none;text-align:center}
#ach.has b{display:block}
#ach.new{animation:achp 1.6s infinite;border-color:var(--sun)}
@keyframes achp{50%{box-shadow:0 0 0 7px rgba(255,212,0,.25),0 0 16px rgba(255,47,180,.7)}}
.achc{width:min(820px,100%);max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch}
.acount{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-weight:800;font-size:14px;letter-spacing:.06em}
.abar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.abar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00c2ff,#ff2fb4,#ffe100,#3dffa2,#00c2ff);background-size:300% 100%;animation:rgb 4s linear infinite;transition:width .6s}
.alogin{background:rgba(255,212,0,.12);border:1px solid rgba(255,212,0,.55);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin:0 0 14px;display:none}
.alogin .btn{margin-top:8px;display:block}
#achg{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.ach{position:relative;overflow:hidden;text-align:center;padding:12px 8px 10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.ach .ico{position:relative;width:78px;height:78px;margin:0 auto 6px}
.ach .ico svg{width:100%;height:100%;display:block;overflow:visible}
.ach .an{font-weight:800;font-size:13px;line-height:1.25;margin-bottom:3px}
.ach .ad{font-size:11px;line-height:1.35;opacity:.72;min-height:30px}
.ach .pb{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin:8px 6px 0;overflow:hidden}
.ach .pb i{display:block;height:100%;background:var(--g);border-radius:3px}
.ach .pn{font-size:10px;opacity:.65;margin-top:4px;letter-spacing:.04em}
.ach .tr{position:absolute;top:6px;left:8px;font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
.ach:not(.on) .ico svg{filter:grayscale(1) brightness(.62);opacity:.55}
.ach:not(.on) .ico::after{content:"\1F512";position:absolute;right:-4px;bottom:-2px;font-size:15px}
.ach:not(.on) .an{opacity:.7}
.ach.on{background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--g) 30%,transparent),rgba(255,255,255,.05) 70%);border-color:color-mix(in srgb,var(--g) 70%,#fff 0%);box-shadow:0 0 18px -6px var(--g)}
.ach.on .tr{opacity:.9;color:var(--g)}
.ach.on .ico svg{animation:aglow 2.2s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.37s)}
.ach.on.ep .ico svg{animation:arb 5s linear infinite;animation-delay:calc(var(--i)*-.3s)}
.ach.on.ep{border-color:transparent;background:linear-gradient(#0a4560,#0a4560) padding-box,linear-gradient(120deg,#00c2ff,#ff2fb4,#ffe100,#3dffa2,#00c2ff) border-box;background-size:auto,300% 100%;animation:rgb 5s linear infinite}
.ach.on::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.22) 50%,transparent 62%);transform:translateX(-130%);animation:sweep 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*.43s);pointer-events:none}
@keyframes sweep{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes aglow{from{filter:drop-shadow(0 0 3px var(--g)) brightness(1)}to{filter:drop-shadow(0 0 11px var(--g)) brightness(1.2)}}
@keyframes arb{from{filter:drop-shadow(0 0 9px var(--g)) hue-rotate(0deg)}to{filter:drop-shadow(0 0 9px var(--g)) hue-rotate(360deg)}}
.sp{position:absolute;font-style:normal;color:#fff;text-shadow:0 0 6px var(--g,#fff),0 0 12px var(--g,#fff);pointer-events:none;opacity:0;animation:tw 2.4s ease-in-out infinite}
.s1{left:-2px;top:2px;font-size:14px}.s2{right:-2px;top:30%;font-size:10px;animation-delay:.8s}.s3{left:28%;bottom:-2px;font-size:12px;animation-delay:1.6s}
@keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
#ap{position:fixed;left:50%;bottom:calc(5vh + 134px + env(safe-area-inset-bottom,0px));transform:translate(-50%,26px) scale(.9);width:min(350px,calc(100vw - 28px));box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(5,34,50,.95);border:1px solid var(--g,#ffd400);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 34px -4px var(--g,#ffd400),0 12px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .35s,transform .5s cubic-bezier(.2,1.5,.4,1);z-index:7}
#ap.on{opacity:1;transform:translate(-50%,0) scale(1)}

ikke gyldige</b> – dette er en testside uten ekte tilbud. Skjemaet er bare et eksempel: e-post og tekst <b>sendes ikke og lagres ikke</b>.", "pz_em": "din@epost.no", "pz_fb": "Tilbakemelding eller ønske til oss (valgfritt)", "pz_c1": "Jeg forstår at rabatten er en demonstrasjon og ikke gyldig, og at skjemaet ikke sender eller lagrer noe. <i>(påkrevd)</i>", "pz_c2": "Eksempel: Ja takk, jeg vil også motta nyhetsbrev og tilbud. <i>(gjør ingenting i demoen)</i>", "pz_get": "Vis demo-rabattkode", "pz_code": "Din demo-rabattkode på", "pz_copy": "Kopier koden", "pz_copied": "Kopiert!", "pz_after": "Demokode – ikke gyldig, og ingenting er sendt eller lagret. Takk for at du spilte!", "pz_terms": "Kryss av for å bekrefte at du forstår at dette er en demonstrasjon.", "score": "Poeng", "record": "rekord", "total": "totalt", "sv": "💾 Lagre", "e_offline": "Ingen kontakt med topplisten – sjekk nettet.", "e_wrong_pin": "Feil PIN for dette navnet. Navnet kan være tatt av en annen spiller.", "e_name_taken": "Navnet er allerede tatt – velg et annet.", "e_bad_pin": "PIN må være 4 siffer.", "e_bad_name": "Navnet må være 1–18 tegn.", "e_not_found": "Fant ikke spilleren.", "e_bad_email": "Skriv inn en gyldig e-postadresse.", "e_generic": "Noe gikk galt – prøv igjen.", "m_save_fail": "Kunne ikke lagre: {e} Poengene er ikke tapt – prøv igjen.", "m_added": "+{v} poeng lagt til {name} – totalt {t} poeng. Plass nr. {r}.", "m_renamed": "Navnet er endret til {name}.", "m_deleted": "{name} og alle dataene er slettet.", "m_del_fail": "Kunne ikke slette: {e}", "ms_level": "Nivå {i} av {n}", "ms": ["Første blekkdråpe", "Fargeprøve", "CMYK-rosetten blomstrer", "Fullfarge!", "Godkjent for trykk"], "fw": ["Peon", "Ring", "Stjerne", "Spiral", "Fontene", "Glorie"], "jackpot": "JACKPOT ×3", "combo": "kombo", "lost": "Planet tapt", "stamp": "Godkjent for trykk<small>VELKOS media · 100 % farge</small>", "help_title": "Veiledning", "help_lang": "Språk", "help": "\n<div class=\"warn\"><b>⚠ Viktig: dette er en testversjon.</b> Siden er et uavhengig eksperiment og en lek under utvikling. Den er <b>bare en demonstrasjon</b>, og <b>rabatter og rabattkoder gjelder foreløpig ikke</b>. Navn og poeng lagres bare for å teste funksjonene – du kan slette spilleren din når som helst.</div>\n<h3>Hva er dette?</h3>\n<p>En interaktiv logo for VELKOS media. To soler går i bane midt i bildet, og fargerike planeter suser rundt dem. Hver gang en planet flyr gjennom en bokstav, spiller bokstaven en tone – sammen blir det musikk. Du kan bare se og lytte, eller spille om poeng.</p>\n<h3>Slik styrer du</h3>\n<ul>\n<li><b>Dra og slipp</b> hvor som helst for å kaste en ny planet. Lengden og retningen på dragningen bestemmer fart og retning. Planeten bøyes automatisk inn i en bane rundt solene – sirkel, ellipse eller spiral.</li>\n<li><b>Kort trykk</b> setter en planet i en rolig sirkelbane.</li>\n<li><b>Beveg musen eller fingeren</b> over logoen – rutene viker unna og samler seg igjen.</li>\n<li>Planetene <b>tiltrekker hverandre</b>. Store planeter trekker sterkere. Kommer to planeter nær hverandre, blir de dratt sammen og eksploderer.</li>\n</ul>\n<h3>Knappene</h3>\n<ul>\n<li><b>↻</b> Start på nytt (poeng du har samlet, lagres først).</li>\n<li><b>★</b> Slå spillmodus på eller av.</li>\n<li><b>🏆</b> Topplisten.</li>\n<li><b>🏅</b> Prestasjoner: trofeer og merker du har låst opp.</li>\n<li><b>?</b> Denne veiledningen.</li>\n<li><b>⏸</b> Pause: alt fryser og blir stille. Trykk ▶ (eller mellomrom) for å fortsette der du var. Spillet pauser også av seg selv når du bytter fane eller vindu, eller ikke rører noe på 45 sekunder – poeng telles bare mens du er til stede.</li>\n<li><b>NO / EN / UA</b> Bytt språk for hele siden.</li>\n<li><b>♫ Lyd</b> Slå lyden på eller av. Nettlesere starter lyden først etter ditt første trykk på siden.</li>\n<li><b>👤 Navn</b> og <b>💾 Lagre</b> i poengpanelet: bytt spiller og legg poengene til kontoen din.</li>\n</ul>\n<h3>Slik får du poeng</h3>\n<p>Trykk <b>★</b> og velg hvem som spiller. Poeng får du bare når to planeter <b>kolliderer inne i en bokstav</b>. Treffet blir et fyrverkeri, og en bit av bokstaven sprekker i fargerike ruter før den samler seg igjen.</p>\n<ul>\n<li><b>Bokstavens verdi:</b> O = 60, V = 40, m = 30, L, K, S og d = 20, de andre = 10.</li>\n<li><b>Fart:</b> jo raskere planetene møtes, jo mer – opptil +50.</li>\n<li><b>Fyrverkeri:</b> Spiral +30, Stjerne og Glorie +20, Fontene +15, Ring +10, Peon +0.</li>\n<li><b>Flaks:</b> +0 til 14 tilfeldige poeng.</li>\n<li><b>Kombo:</b> et nytt treff innen 4 sekunder gir ×2, ×3 … opptil ×5.</li>\n<li><b>Jackpot:</b> 10 % sjanse for at treffet teller ×3.</li>\n<li><b>Tapt planet:</b> kaster du en planet ut av universet, mister du ca. 3 % av poengene (15–120) og komboen.</li>\n<li>Kollisjoner utenfor bokstavene og planeter som faller inn i solene gir ingen poeng.</li>\n</ul>\n<h3>Verden får farge</h3>\n<p>Jo flere poeng, jo mer farge «trykker» du på bakgrunnen – akkurat som i et trykkeri:</p>\n<ol>\n<li><b>250</b> – Første blekkdråpe: hvert treff etterlater CMYK-blekk.</li>\n<li><b>750</b> – Fargeprøve: skjæremerker, passmerker og fargestrimmel dukker opp.</li>\n<li><b>1 500</b> – CMYK-rosetten blomstrer: rasterpunkter brer seg fra midten.</li>\n<li><b>3 000</b> – Fullfarge: RGB-lys og nordlys over hele himmelen.</li>\n<li><b>6 000</b> – Godkjent for trykk: stempelet faller!</li>\n</ol>\n<h3>Spillere og toppliste</h3>\n<ul>\n<li>Velg et <b>spillernavn og en 4-sifret PIN</b>. Samme navn og PIN fungerer på alle enheter, og ingen andre kan spille på kontoen din.</li>\n<li>Når siden åpnes, blir du spurt om navn og PIN – eller du kan fortsette som gjest. Neste gang husker siden deg og starter spillet direkte.</li>\n<li>Poengene <b>lagres automatisk</b> – hvert 20. sekund, når du slår av spillet og når du lukker siden. Med <b>💾 Lagre</b> lagrer du med en gang. Poengene <b>legges sammen</b> – hver spiller står bare én gang på listen.</li>\n<li>Flere kan spille på samme enhet: trykk på navnet ditt (👤) eller «Bytt spiller».</li>\n<li>På topplisten kan du endre navn, <b>nullstille poengene</b> (spilleren beholdes) eller slette spilleren helt. Begge deler bekreftes med PIN-koden din.</li>\n<li>Vil du bare se på? Velg «Spill som gjest» – da lagres ingenting.</li>\n</ul>\n<h3>Rabatt for nr. 1 (test)</h3>\n<p>Den som går til topps på listen, får se et tilbud på 2–5 % rabatt (flere poeng gir høyere prosent, aldri over 5 %) og får se et eksempelskjema der man kan oppgi e-post og en tilbakemelding. <b>Dette er bare en demonstrasjon: rabatten er ikke gyldig, og ingenting sendes eller lagres.</b></p>\n<h3>Prestasjoner</h3>\n<p>Når du er logget inn, kan du låse opp trofeer, medaljer og merker – for poeng, kombo, jackpot, fyrverkeri, treff i bestemte bokstaver og mye mer. Trykk <b>🏅</b> for å se samlingen din: der ser du hva som gjenstår og hvor langt du har kommet. Hver gang du låser opp noe, kommer en feiring med lyd. Noen prestasjoner er hemmelige! Poengprestasjonene følger kontoen din på alle enheter, de andre lagres i denne nettleseren.</p>\n<h3>Tips</h3>\n<ul>\n<li>Kast planeter slik at de passerer <b>nær hverandre over en bokstav</b> – tiltrekningen gjør resten.</li>\n<li>Treff O-en: den er verdt mest.</li>\n<li>Bruk hodetelefoner – hver bokstav er en tone.</li>\n</ul>\n", "del_ck": "Jeg forstår og samtykker i at alle mine data slettes permanent.", "e_del_ck": "Kryss av for å bekrefte slettingen.", "lb_continue": "▶ Fortsett å spille"}, "en": {"html_lang": "en", "paused_auto": "⏸ Paused – you were away. Tap or move the mouse to continue", "t_ach": "Achievements", "ach_title": "🏅 Achievements", "ach_sub": "Collect trophies, medals and badges while you play.", "ach_login_txt": "Achievements are saved on your player account. Log in or create a player to unlock them.", "ach_login_btn": "Log in / new player", "ach_new": "New achievement!", "ach_guest": "💡 Log in (👤) to unlock achievements and trophies", "ach_secret": "Secret achievement – find it yoursel "Copy the code", "pz_copied": "Copied!", "pz_after": "Demo code – not valid, and nothing has been sent or stored. Thanks for playing!", "pz_terms": "Tick the box to confirm that you understand this is a demonstration.", "score": "Points", "record": "best", "total": "total", "sv": "💾 Save", "e_offline": "No connection to the leaderboard – check your network.", "e_wrong_pin": "Wrong PIN for this name. The name may belong to another player.", "e_name_taken": "That name is taken – choose another.", "e_bad_pin": "The PIN must be 4 digits.", "e_bad_name": "The name must be 1–18 characters.", "e_not_found": "Player not found.", "e_bad_email": "Enter a valid e-mail address.", "e_generic": "Something went wrong – please try again.", "m_save_fail": "Could not save: {e} Your points are not lost – try again.", "m_added": "+{v} points added to {name} – {t} points in total. Rank #{r}.", "m_renamed": "Name changed to {name}.", "m_deleted": "{name} and all data have been deleted.", "m_del_fail": "Could not delete: {e}", "ms_level": "Level {i} of {n}", "ms": ["First drop of ink", "Colour proof", "The CMYK rosette blooms", "Full colour!", "Approved for print"], "fw": ["Peony", "Ring", "Star", "Spiral", "Fountain", "Halo"], "jackpot": "JACKPOT ×3", "combo": "combo", "lost": "Planet lost", "stamp": "Approved for print<small>VELKOS media · 100 % colour</small>", "help_title": "How to play", "help_lang": "Language", "help": "\n<div class=\"warn\"><b>⚠ Important: this is a test version.</b> The page is an independent experiment and a toy in development. It is <b>only a demonstration</b>, and <b>discounts and discount codes are not valid at the moment</b>. Names and points are stored only to test the features – you can delete your player at any time.</div>\n<h3>What is this?</h3>\n<p>An interactive logo for VELKOS media. Two suns orbit in the middle of the screen, and colourful planets whizz around them. Every time a planet flies through a letter, the letter plays a note – together they make music. You can just watch and listen, or play for points.</p>\n<h3>Controls</h3>\n<ul>\n<li><b>Drag and release</b> anywhere to throw a new planet. The length and direction of the drag set its speed and direction. The planet is automatically bent into an orbit around the suns – a circle, an ellipse or a spiral.</li>\n<li>A <b>short tap</b> puts a planet into a calm circular orbit.</li>\n<li><b>Move the mouse or your finger</b> over the logo – the squares move aside and gather again.</li>\n<li>Planets <b>attract each other</b>. Big planets pull harder. When two planets come close, they are pulled together and explode.</li>\n</ul>\n<h3>Buttons</h3>\n<ul>\n<li><b>↻</b> Restart (points you have collected are saved first).</li>\n<li><b>★</b> Turn game mode on or off.</li>\n<li><b>🏆</b> The leaderboard.</li>\n<li><b>🏅</b> Achievements: the trophies and badges you have unlocked.</li>\n<li><b>?</b> This guide.</li>\n<li><b>⏸</b> Pause: everything freezes and goes quiet. Press ▶ (or space) to continue where you left off. The game also pauses by itself when you switch tab or window, or touch nothing for 45 seconds – points only count while you are present.</li>\n<li><b>NO / EN / UA</b> Change the language of the whole page.</li>\n<li><b>♫ Sound</b> Turn sound on or off. Browsers only start sound after your first tap on the page.</li>\n<li><b>👤 Name</b> and <b>💾 Save</b> in the score panel: switch player and add the points to your account.</li>\n</ul>\n<h3>How to score</h3>\n<p>Press <b>★</b> and choose who is playing. You only score when two planets <b>collide inside a letter</b>. The hit becomes a firework, and a piece of the letter bursts into colourful squares before it gathers again.</p>\n<ul>\n<li><b>Letter value:</b> O = 60, V = 40, m = 30, L, K, S and d = 20, the others = 10.</li>\n<li><b>Speed:</b> the faster the planets meet, the more – up to +50.</li>\n<li><b>Firework:</b> Spiral +30, Star and Halo +20, Fountain +15, Ring +10, Peony +0.</li>\n<li><b>Luck:</b> +0 to 14 random points.</li>\n<li><b>Combo:</b> a new hit within 4 seconds gives ×2, ×3 … up to ×5.</li>\n<li><b>Jackpot:</b> a 10 % chance that the hit counts ×3.</li>\n<li><b>Lost planet:</b> if you throw a planet out of the universe, you lose about 3 % of your points (15–120) and your combo.</li>\n<li>Collisions outside the letters and planets falling into the suns give no points.</li>\n</ul>\n<h3>The world gets colour</h3>\n<p>The more points, the more colour you \"print\" onto the background – just like in a print shop:</p>\n<ol>\n<li><b>250</b> – First drop of ink: every hit leaves CMYK ink.</li>\n<li><b>750</b> – Colour proof: crop marks, registration marks and a colour bar appear.</li>\n<li><b>1 500</b> – The CMYK rosette blooms: halftone dots spread from the centre.</li>\n<li><b>3 000</b> – Full colour: RGB light and northern lights across the sky.</li>\n<li><b>6 000</b> – Approved for print: down comes the stamp!</li>\n</ol>\n<h3>Players and leaderboard</h3>\n<ul>\n<li>Choose a <b>player name and a 4-digit PIN</b>. The same name and PIN work on every device, and nobody else can play on your account.</li>\n<li>When the page opens, you are asked for a name and PIN – or you can continue as a guest. Next time the page remembers you and starts the game right away.</li>\n<li>Points are <b>saved automatically</b> – every 20 seconds, when you turn the game off and when you close the page. <b>💾 Save</b> saves immediately. Points <b>add up</b> – each player appears only once on the list.</li>\n<li>Several people can play on the same device: tap your name (👤) or \"Switch player\".</li>\n<li>On the leaderboard you can rename, <b>reset your points</b> (the player is kept) or delete the player completely. Both are confirmed with your PIN.</li>\n<li>Just want to watch? Choose \"Play as guest\" – nothing is saved.</li>\n</ul>\n<h3>Discount for #1 (test)</h3>\n<p>Whoever reaches the top of the list is shown a 2–5 % discount offer (more points give a higher percentage, never above 5 %) and is shown an example form where an e-mail and feedback could be entered. <b>This is only a demonstration: the discount is not valid, and nothing is sent or stored.</b></p>\n<h3>Achievements</h3>\n<p>When you are logged in, you can unlock trophies, medals and badges – for points, combos, jackpots, fireworks, hits in particular letters and much more. Press <b>🏅</b> to see your collection: it shows what is left and how far you have come. Every unlock comes with a celebration and a sound. Some achievements are secret! Point achievements follow your account on every device; the others are saved in this browser.</p>\n<h3>Tips</h3>\n<ul>\n<li>Throw planets so they pass <b>close to each other over a letter</b> – the attraction does the rest.</li>\n<li>Hit the O: it is worth the most.</li>\n<li>Use headphones – every letter is a note.</li>\n</ul>\n", "del_ck": "I understand and agree that all my data will be deleted permanently.", "e_del_ck": "Tick the box to confirm the deletion.", "lb_continue": "▶ Continue playing"}, "uk": {"html_lang": "uk", "paused_auto": "⏸ Пауза – вас не було. Торкніться або поворухніть мишею, щоб продовжити", "t_ach": "Досягнення", "ach_title": "🏅 Досягнення", "ach_sub": "Збирайте кубки, медалі та значки під час гри.", "ach_login_txt": "Досягнення зберігаються в акаунті гравця. Увійдіть або створіть гравця, щоб їх відкривати.", "ach_login_btn": "Увійти / новий гравець", "ach_new": "Нове досягнення!", "ach_guest": "💡 Увійдіть (👤), щоб відкривати досягнення та кубки", "ach_secret": "Секретне досягнення – знайдіть його самі!", "ach_opened": "Відкрито {d}", "ach_tiers": ["Бронза", "Срібло", "Золото", "Епічне"], "ach_back": "🏅 {n} досягнень відкрито за вашими очками", "sound_off": "Звук вимк.", "sound_on": "Звук увімк.", "sound_tap": "Торкніться для звуку", "foot": "Даруємо світу <b>кольори</b>", "copy": "© 2026 Roman Velychko · Тестова версія – лише демонстрація. Знижки й коди не діють.", "hint": "Потягніть, щоб кинути планету · кожна літера рбіту.</li>\n<li><b>Ведіть мишею або пальцем</b> над логотипом – квадратики розступаються і знову збираються.</li>\n<li>Планети <b>притягують одна одну</b>. Великі притягують сильніше. Коли дві планети опиняються поруч, їх стягує докупи, і вони вибухають.</li>\n</ul>\n<h3>Кнопки</h3>\n<ul>\n<li><b>↻</b> Почати знову (зібрані очки спершу зберігаються).</li>\n<li><b>★</b> Увімкнути або вимкнути режим гри.</li>\n<li><b>🏆</b> Таблиця лідерів.</li>\n<li><b>🏅</b> Досягнення: кубки та значки, які ви відкрили.</li>\n<li><b>?</b> Ця інструкція.</li>\n<li><b>⏸</b> Пауза: усе завмирає і стихає. Натисніть ▶ (або пробіл), щоб продовжити з того самого місця. Гра також сама ставиться на паузу, коли ви перемикаєте вкладку чи вікно або 45 секунд нічого не робите – очки нараховуються лише поки ви на місці.</li>\n<li><b>NO / EN / UA</b> Змінити мову всієї сторінки.</li>\n<li><b>♫ Звук</b> Увімкнути або вимкнути звук. Браузери вмикають звук лише після першого торкання сторінки.</li>\n<li><b>👤 Ім'я</b> і <b>💾 Зберегти</b> на панелі очок: змінити гравця й додати очки до свого акаунта.</li>\n</ul>\n<h3>Як отримати очки</h3>\n<p>Натисніть <b>★</b> і оберіть, хто грає. Очки нараховуються лише тоді, коли дві планети <b>зіштовхуються всередині літери</b>. Влучання перетворюється на феєрверк, і шматочок літери розлітається різнокольоровими квадратиками, а потім збирається знову.</p>\n<ul>\n<li><b>Цінність літери:</b> O = 60, V = 40, m = 30, L, K, S і d = 20, решта = 10.</li>\n<li><b>Швидкість:</b> що швидше зустрічаються планети, то більше – до +50.</li>\n<li><b>Феєрверк:</b> Спіраль +30, Зірка і Німб +20, Фонтан +15, Кільце +10, Півонія +0.</li>\n<li><b>Удача:</b> від +0 до 14 випадкових очок.</li>\n<li><b>Комбо:</b> нове влучання протягом 4 секунд дає ×2, ×3 … до ×5.</li>\n<li><b>Джекпот:</b> 10 % шансу, що влучання зарахується ×3.</li>\n<li><b>Втрачена планета:</b> якщо ви викинете планету за межі всесвіту, то втратите близько 3 % очок (15–120) і комбо.</li>\n<li>Зіткнення поза літерами та планети, що падають у сонця, очок не дають.</li>\n</ul>\n<h3>Світ набуває кольору</h3>\n<p>Що більше очок, то більше кольору ви «друкуєте» на тлі – як у друкарні:</p>\n<ol>\n<li><b>250</b> – Перша крапля фарби: кожне влучання залишає CMYK-фарбу.</li>\n<li><b>750</b> – Кольоропроба: з'являються мітки обрізу, мітки приводки та шкала кольорів.</li>\n<li><b>1 500</b> – Розквітає CMYK-розетка: растрові точки розходяться від центру.</li>\n<li><b>3 000</b> – Повний колір: RGB-світло і північне сяйво на все небо.</li>\n<li><b>6 000</b> – Схвалено до друку: падає печатка!</li>\n</ol>\n<h3>Гравці й таблиця лідерів</h3>\n<ul>\n<li>Оберіть <b>ім'я гравця і PIN із 4 цифр</b>. Те саме ім'я та PIN працюють на всіх пристроях, і ніхто інший не зможе грати під вашим акаунтом.</li>\n<li>Під час відкриття сторінки вас попросять ввести ім'я та PIN – або можна продовжити як гість. Наступного разу сторінка запам'ятає вас і одразу почне гру.</li>\n<li>Очки <b>зберігаються автоматично</b> – кожні 20 секунд, коли ви вимикаєте гру і коли закриваєте сторінку. <b>💾 Зберегти</b> зберігає одразу. Очки <b>сумуються</b> – кожен гравець є в списку лише один раз.</li>\n<li>На одному пристрої можуть грати кілька людей: натисніть на своє ім'я (👤) або «Змінити гравця».</li>\n<li>У таблиці лідерів можна змінити ім'я, <b>обнулити очки</b> (гравець залишається) або повністю видалити гравця. Обидві дії підтверджуються PIN-кодом.</li>\n<li>Хочете лише подивитися? Оберіть «Грати як гість» – нічого не зберігається.</li>\n</ul>\n<h3>Знижка для №1 (тест)</h3>\n<p>Хто вийде на перше місце, побачить пропозицію знижки 2–5 % (більше очок – вищий відсоток, але не понад 5 %) і побачить приклад форми, де можна вказати e-mail та відгук. <b>Це лише демонстрація: знижка не діє, і нічого не надсилається і не зберігається.</b></p>\n<h3>Досягнення</h3>\n<p>Коли ви увійшли в акаунт, ви можете відкривати кубки, медалі та значки – за очки, комбо, джекпоти, феєрверки, влучання в певні літери та багато іншого. Натисніть <b>🏅</b>, const gS=(R,r)=>{let p='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;p+=(i?'L':'M')+(Math.cos(a)*q).toFixed(1)+' '+(Math.sin(a)*q).toFixed(1)}return p+'Z'};
const ray=(n,a,b)=>{let r='';for(let i=0;i<n;i++){const t=i*Math.PI*2/n;r+=`M${(Math.cos(t)*a).toFixed(1)} ${(Math.sin(t)*a).toFixed(1)}L${(Math.cos(t)*b).toFixed(1)} ${(Math.sin(t)*b).toFixed(1)}`}return r};
// glyph: outlined white drawing in a +-20 box
function glyph(g){
 const O=(m,a=6.4,b=2.4)=>`<g fill="#052f47" stroke="#052f47" stroke-width="${a}" stroke-linejoin="round" stroke-linecap="round">${m}</g><g fill="#fff" stroke="#fff" stroke-width="${b}" stroke-linejoin="round" stroke-linecap="round">${m}</g>`;
 if(g.startsWith('text:')){const[,t,sz]=g.split(':'),s=+sz||19;return O(`<text x="0" y="${(s*.35).toFixed(1)}" text-anchor="middle" font-weight="800" font-size="${s}" font-family="Poppins,Arial,sans-serif">${t}</text>`,4.2,.8)}
 switch(g){
  case'star':return O(`<path d="${gS(19,8)}"/>`);
  case'bolt':return O('<path d="M4 -19L-11 3H-1L-4 19L11 -4H1Z"/>');
  case'burst':return O(`<path d="${ray(8,7,18)}" fill="none"/><circle r="4.5"/>`);
  case'sun':return O(`<path d="${ray(8,11,19)}" fill="none"/><circle r="8"/>`);
  case'planet':return O('<circle r="8"/><path d="M-19 5C-8 13 12 5 19 -4" fill="none"/>');
  case'comet':return O('<circle cx="8" cy="-7" r="7"/><path d="M2 -2L-18 14M-2 -9L-18 -3M7 3L-5 17" fill="none"/>');
  case'chain':return O('<path d="M-13 6L0 -6L13 6" fill="none"/><circle cx="-13" cy="6" r="5"/><circle cx="0" cy="-6" r="5"/><circle cx="13" cy="6" r="5"/>');
  case'lost':return O('<circle cx="-5" cy="5" r="8"/><path d="M4 -4L17 -17M8 -17H17V-8" fill="none"/>');
  case'dice':return '<rect x="-14" y="-14" width="28" height="28" rx="7" fill="#fff" stroke="#052f47" stroke-width="3"/>'+[[-7,-7],[7,-7],[0,0],[-7,7],[7,7]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#d6006f"/>`).join('');
  case'target':return '<circle r="17" fill="#fff" stroke="#052f47" stroke-width="3"/><circle r="11" fill="#ff2fb4"/><circle r="6" fill="#fff"/><circle r="2.5" fill="#052f47"/>';
  case'clock':return '<circle r="16" fill="#fff" stroke="#052f47" stroke-width="3"/><path d="M0 -9V1L8 5" fill="none" stroke="#052f47" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>';
  case'globe':return '<circle r="16" fill="#fff" stroke="#052f47" stroke-width="3"/><g fill="none" stroke="#0090d0" stroke-width="2.2"><ellipse rx="6.5" ry="16"/><path d="M-16 0H16M-13 -8H13M-13 8H13"/></g>';
  case'stamp':return '<rect x="-17" y="-13" width="34" height="26" rx="5" fill="#fff" stroke="#052f47" stroke-width="3"/><path d="M-8 0L-2 6L9 -7" fill="none" stroke="#d6006f" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>';
  case'cmyk':return '<g stroke="#052f47" stroke-width="2"><circle cx="-7" cy="-6" r="10" fill="#00b9ff"/><circle cx="7" cy="-6" r="10" fill="#ff00aa" fill-opacity=".92"/><circle cx="0" cy="7" r="10" fill="#ffe100" fill-opacity=".92"/></g>';
 }return''}
